var EFFECT_ORDER = ["gradient", "gdots", "gchars", "dissolve", "dither", "ascii"];

/* Grouped so the panel states plainly which effects need an upload. `id` is
   the internal handle (stable across label renames — used as state map key);
   `label` is the display string on the mode tab. */
var EFFECT_GROUPS = [
  { id: "generative", label: "Generative", ids: ["gradient", "gdots", "gchars", "dissolve"] },
  { id: "from-image", label: "From image", ids: ["dither", "ascii"] }
];

/* ============================================================================
   STATE
   Each effect keeps its own parameter state, so switching away and back
   restores what you left rather than resetting to defaults.
   ============================================================================ */

var state = {
  effect: "gradient",
  /* Last-active effect per mode, so tabbing "Generative → From image → Generative"
     lands you back on whatever generative effect you had, not on the first one.
     Keyed by group.id, not label, so a label rename doesn't strand state. */
  lastEffectInMode: {},
  ratio: "1:1",
  params: {},
  activePreset: {},
  image: null,
  imageName: "",
  imageDims: "",
  playing: true,
  phase: 0,
  lastT: 0,
  recording: false,
  userPresets: {}
};

for (var i = 0; i < EFFECT_ORDER.length; i++) {
  var id = EFFECT_ORDER[i];
  state.params[id] = Object.assign({}, EFFECTS[id].defaults);
  state.activePreset[id] = Object.keys(EFFECTS[id].presets)[0];
}

/* Which group a given effect belongs to. Every effect is in exactly one group
   (EFFECT_ORDER and the group.ids lists are the same set), so the fallback
   this used to have was dead defense — removed. */
function groupOfEffect(id){
  for (var i = 0; i < EFFECT_GROUPS.length; i++) {
    if (EFFECT_GROUPS[i].ids.indexOf(id) >= 0) return EFFECT_GROUPS[i];
  }
}

function currentEffect(){ return EFFECTS[state.effect]; }
function currentParams(){ return state.params[state.effect]; }

/* ---------------------------------------------------------- preset storage */

function loadUserPresets(){
  try {
    var raw = localStorage.getItem(STORE_KEY);
    state.userPresets = raw ? JSON.parse(raw) : {};
  } catch (e) {
    state.userPresets = {};
  }
  for (var i = 0; i < EFFECT_ORDER.length; i++) {
    if (!state.userPresets[EFFECT_ORDER[i]]) state.userPresets[EFFECT_ORDER[i]] = {};
  }
}

function saveUserPresets(){
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state.userPresets));
  } catch (e) {
    /* Storage unavailable (private mode, quota). Presets stay in memory. */
  }
}

/* ----------------------------------------------------------- ratio storage */

function loadRatio(){
  try {
    var raw = localStorage.getItem(RATIO_KEY);
    if (raw) state.ratio = ratioById(raw).id;
  } catch (e) {
    /* Storage unavailable. The default square stands. */
  }
}

function saveRatio(){
  try {
    localStorage.setItem(RATIO_KEY, state.ratio);
  } catch (e) {
    /* Storage unavailable. The choice still holds for this session. */
  }
}

function allPresets(effectId){
  return Object.assign({}, EFFECTS[effectId].presets, state.userPresets[effectId] || {});
}

function presetSnapshot(effectId, name){
  var all = allPresets(effectId);
  return all[name] || null;
}

/* Which keys differ from the active preset. */
function dirtyKeys(){
  var snap = presetSnapshot(state.effect, state.activePreset[state.effect]);
  if (!snap) return [];
  var p = currentParams();
  var out = [];
  for (var k in snap) {
    if (!Object.prototype.hasOwnProperty.call(snap, k)) continue;
    var a = p[k], b = snap[k];
    if (typeof a === "number" && typeof b === "number") {
      if (Math.abs(a - b) > 1e-6) out.push(k);
    } else if (a !== b) {
      out.push(k);
    }
  }
  return out;
}

/* ============================================================================
   PANEL RENDERING
   ============================================================================ */

var controlsEl = el("controls");
var switchEl = el("switch");
var exportEl = el("exportBlock");

/* True when the effect renders through the WebGL pipeline. Declared on the
   effect itself (needsGL: true) rather than inferred from an unrelated field
   like `source === "gradient"` — that inference broke as soon as a future
   effect happened to be named "gradient" or a future GL effect wasn't
   gradient-derived. */
function needsGL(id){ return !!EFFECTS[id].needsGL; }

/* Variant B: mode tabs on top ("Generative" / "From image"), a native <select>
   below for effects within the current mode. The mode currently displayed is
   derived from state.effect via groupOfEffect — no separate state.mode field;
   state.lastEffectInMode remembers the last-active effect per group so tabbing
   between modes returns you to where you were. */
function buildSwitch(){
  switchEl.innerHTML = "";
  var currentGroup = groupOfEffect(state.effect);

  /* Mode tabs — reuse .switch__row / .switch__seg so the two rows in the
     panel are visually the same primitive at different levels. */
  var tabsRow = document.createElement("div");
  tabsRow.className = "switch__row";
  tabsRow.setAttribute("role", "tablist");
  tabsRow.setAttribute("aria-label", "Effect family");
  for (var g = 0; g < EFFECT_GROUPS.length; g++) {
    (function(group){
      var b = document.createElement("button");
      b.type = "button";
      var isActive = (group === currentGroup);
      b.className = "switch__seg" + (isActive ? " is-active" : "");
      b.textContent = group.label;
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", isActive ? "true" : "false");
      b.addEventListener("click", function(){ setMode(group.id); });
      tabsRow.appendChild(b);
    })(EFFECT_GROUPS[g]);
  }
  switchEl.appendChild(tabsRow);

  /* Effect picker — only the current mode's effects. A disabled <option>
     stays visible in the dropdown but can't be selected, so it doubles as the
     visible reason a WebGL-dependent effect is unavailable. */
  var sel = document.createElement("select");
  sel.className = "select fx-select";
  sel.id = "fxSelect";
  sel.setAttribute("aria-label", "Effect");
  for (var i = 0; i < currentGroup.ids.length; i++) {
    var id = currentGroup.ids[i];
    var opt = document.createElement("option");
    opt.value = id;
    opt.textContent = EFFECTS[id].label +
      (glFailed && needsGL(id) ? " — needs WebGL" : "");
    if (glFailed && needsGL(id)) opt.disabled = true;
    if (id === state.effect) opt.selected = true;
    sel.appendChild(opt);
  }
  sel.addEventListener("change", function(){
    /* Effect switching preserves state.params[id] so no dirty guard is
       needed; the previous effect's edits are still there on return. */
    setEffect(sel.value);
  });
  switchEl.appendChild(sel);
}

/* Mode tab click. Restore the last-active effect for that group (or its first
   effect if never visited). If the target would be WebGL-dead, pick the first
   non-dead effect in the group instead. */
function setMode(groupId){
  if (groupOfEffect(state.effect).id === groupId) return;
  var group;
  for (var i = 0; i < EFFECT_GROUPS.length; i++) {
    if (EFFECT_GROUPS[i].id === groupId) { group = EFFECT_GROUPS[i]; break; }
  }
  var target = state.lastEffectInMode[groupId] || group.ids[0];
  if (glFailed && needsGL(target)) {
    for (var j = 0; j < group.ids.length; j++) {
      if (!needsGL(group.ids[j])) { target = group.ids[j]; break; }
    }
  }
  setEffect(target);
}

function makeSection(legend, hint){
  var s = document.createElement("div");
  s.className = "section";
  /* <h2> rather than <span> — a screen-reader user gets an outline of the
     panel's sections. The .section__legend class holds the visual style so
     nothing looks different; only the semantics change. */
  var h = document.createElement("h2");
  h.className = "section__legend";
  h.textContent = legend;
  s.appendChild(h);
  if (hint) {
    /* One line, plain language, sits under the legend. Non-coder-friendly
       explanation of what the controls in this section actually do — the
       load-bearing constraint. Data-driven from EFFECTS. */
    var t = document.createElement("p");
    t.className = "section__hint";
    t.textContent = hint;
    s.appendChild(t);
  }
  return s;
}

function fmtVal(v, dp, suffix){
  var n = (dp === 0) ? String(Math.round(v)) : Number(v).toFixed(dp);
  return n + (suffix || "");
}

function makeRange(ctrl){
  var p = currentParams();
  var wrap = document.createElement("div");
  wrap.className = "ctrl";

  var head = document.createElement("div");
  head.className = "ctrl__head";
  var lab = document.createElement("label");
  lab.className = "ctrl__label";
  lab.textContent = ctrl.label;
  /* Editable value — presets print exact numbers, and getting to a specific
     one by dragging is fiddly. Kept as <input type=text> rather than number
     so we control formatting (dp, suffix) and validation ourselves — the
     browser's number spinners would break the tight ctrl__value column. */
  var val = document.createElement("input");
  val.type = "text";
  val.className = "field ctrl__value";
  val.value = fmtVal(p[ctrl.key], ctrl.dp, ctrl.suffix);
  val.spellcheck = false;
  val.autocomplete = "off";
  val.setAttribute("aria-label", ctrl.label + " value");
  val.setAttribute("inputmode", "decimal");
  head.appendChild(lab);
  head.appendChild(val);

  var input = document.createElement("input");
  input.type = "range";
  input.min = ctrl.min;
  input.max = ctrl.max;
  input.step = ctrl.step;
  input.value = p[ctrl.key];
  input.id = "ctl-" + state.effect + "-" + ctrl.key;
  lab.setAttribute("for", input.id);

  function paint(){
    var pct = ((input.value - ctrl.min) / (ctrl.max - ctrl.min)) * 100;
    input.style.setProperty("--fill", pct + "%");
  }
  paint();

  /* Common commit path — write to params, sync both inputs, repaint fill,
     re-render. Numeric args are already clamped/quantised by the caller. */
  function commit(v){
    currentParams()[ctrl.key] = v;
    input.value = v;
    val.value = fmtVal(v, ctrl.dp, ctrl.suffix);
    paint();
    onParamChange();
  }

  input.addEventListener("input", function(){
    if (input.disabled) return;
    var v = parseFloat(input.value);
    currentParams()[ctrl.key] = v;
    /* Skip val.value = ... to avoid caret jump if the user happens to focus
       the value while dragging. Just display the value; the field's not
       being edited by the user in this path. */
    val.value = fmtVal(v, ctrl.dp, ctrl.suffix);
    paint();
    onParamChange();
  });

  /* Editable value field: parse on blur / Enter. Live typing is intentionally
     not committed — half-typed "0.4" would repaint the frame at 0. */
  function parseEntry(){
    /* Strip any suffix the user left in place, then parse. */
    var raw = val.value;
    if (ctrl.suffix) raw = raw.replace(ctrl.suffix, "");
    var v = parseFloat(raw);
    if (isNaN(v)) return null;
    v = clamp(v, ctrl.min, ctrl.max);
    /* Snap to the range's step so the value the user typed matches what the
       slider can actually represent — otherwise thumb + value would disagree. */
    if (ctrl.step) v = Math.round(v / ctrl.step) * ctrl.step;
    return v;
  }
  function settle(){
    if (val.disabled) return;
    var v = parseEntry();
    if (v === null) {
      /* Bad input — restore. */
      val.value = fmtVal(currentParams()[ctrl.key], ctrl.dp, ctrl.suffix);
      return;
    }
    commit(v);
  }
  val.addEventListener("focus", function(){ val.select(); });
  val.addEventListener("blur", settle);
  val.addEventListener("keydown", function(e){
    if (e.key === "Enter") { e.preventDefault(); settle(); val.blur(); }
    else if (e.key === "Escape") {
      val.value = fmtVal(currentParams()[ctrl.key], ctrl.dp, ctrl.suffix);
      val.blur();
    }
  });

  wrap.appendChild(head);
  wrap.appendChild(input);
  return wrap;
}

function makeColor(ctrl){
  var p = currentParams();
  var row = document.createElement("div");
  row.className = "swatch";

  var chip = document.createElement("input");
  chip.type = "color";
  chip.className = "swatch__chip";
  chip.value = p[ctrl.key];
  chip.id = "ctl-" + state.effect + "-" + ctrl.key;

  var lab = document.createElement("label");
  lab.className = "swatch__label";
  lab.textContent = ctrl.label;
  lab.setAttribute("for", chip.id);

  /* Editable, because a colour often arrives as a code — from a brand sheet,
     another tool, a screenshot someone eyedroppered — and hunting for it by
     eye in the OS colour dialog lands somewhere near it, not on it. */
  var hex = document.createElement("input");
  hex.type = "text";
  hex.className = "field swatch__hex";
  hex.value = p[ctrl.key];
  hex.maxLength = 7;
  hex.spellcheck = false;
  hex.autocomplete = "off";
  /* A hex code is a token, not translatable text — Chrome's auto-translate
     would otherwise mangle it. */
  hex.setAttribute("translate", "no");
  hex.setAttribute("aria-label", ctrl.label + " hex");

  /* Single path in, so the chip, the field and the params never disagree.
     Bails when nothing moved: both inputs can restate a colour they already
     hold, and each pass through here is a re-render. */
  function commit(v){
    var cp = currentParams();
    if (cp[ctrl.key] === v) return;
    cp[ctrl.key] = v;
    chip.value = v;
    hex.value = v;
    onParamChange();
  }

  chip.addEventListener("input", function(){
    /* A disabled input cannot be driven by a user, but it can still be sent an
       event programmatically. Guard so "inert" means inert either way. */
    if (chip.disabled) return;
    commit(chip.value);
  });

  /* Live while typing, but only once the text is a whole colour — so a
     half-typed "#f4" never repaints the frame. Deliberately not commit(): that
     writes the field back, and rewriting an input mid-keystroke throws the
     caret to the end. Straightening out "b0d000" into "#b0d000" waits for
     settle(), by which time the user is no longer in the field. */
  hex.addEventListener("input", function(){
    if (hex.disabled) return;
    var v = normalizeHex(hex.value);
    if (v) {
      currentParams()[ctrl.key] = v;
      chip.value = v;
      onParamChange();
    }
  });

  /* Normalise once the user is done — or put the live colour back if what they
     typed never became one, so the field can never sit showing a value the
     frame does not have. */
  function settle(){
    var v = normalizeHex(hex.value);
    hex.value = v || currentParams()[ctrl.key];
    if (v) commit(v);
  }

  hex.addEventListener("blur", settle);
  hex.addEventListener("focus", function(){ hex.select(); });
  hex.addEventListener("keydown", function(e){
    if (e.key === "Enter") { e.preventDefault(); settle(); hex.blur(); }
    else if (e.key === "Escape") { hex.value = currentParams()[ctrl.key]; hex.blur(); }
  });

  row.appendChild(chip);
  row.appendChild(lab);
  row.appendChild(hex);
  return row;
}

function makeSelect(ctrl){
  var p = currentParams();
  var sel = document.createElement("select");
  sel.className = "select";
  sel.id = "ctl-" + state.effect + "-" + ctrl.key;
  sel.setAttribute("aria-label", ctrl.label);
  for (var i = 0; i < ctrl.options.length; i++) {
    var o = document.createElement("option");
    o.value = ctrl.options[i].value;
    o.textContent = ctrl.options[i].label;
    if (String(p[ctrl.key]) === String(ctrl.options[i].value)) o.selected = true;
    sel.appendChild(o);
  }
  sel.addEventListener("change", function(){
    currentParams()[ctrl.key] = sel.value;
    /* A select is the only control that can gate other controls, so this is
       the only place states need re-evaluating. Toggling classes rather than
       calling buildControls() keeps focus on the select the user just used. */
    syncControlStates();
    onParamChange();
  });
  return sel;
}

/* Hides any control declared with activeWhen whose value the current params
   don't match. See brief for the "hide, not dim" reasoning. */
function syncControlStates(){
  var p = currentParams();
  var nodes = controlsEl.querySelectorAll("[data-active-key]");
  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    n.hidden = String(p[n.getAttribute("data-active-key")]) !== n.getAttribute("data-active-val");
  }
}

function makeToggle(ctrl){
  var p = currentParams();
  var row = document.createElement("div");
  row.className = "toggle";

  var btn = document.createElement("button");
  btn.type = "button";
  btn.className = "toggle__switch" + (p[ctrl.key] ? " is-on" : "");
  btn.setAttribute("role", "switch");
  btn.setAttribute("aria-checked", p[ctrl.key] ? "true" : "false");
  btn.setAttribute("aria-label", ctrl.label);
  btn.id = "ctl-" + state.effect + "-" + ctrl.key;
  var knob = document.createElement("span");
  knob.className = "toggle__knob";
  btn.appendChild(knob);

  /* Real <label> tied to the switch button — clicking the word "Grain" now
     toggles it, matching every other row where the label is a hit target. */
  var lab = document.createElement("label");
  lab.className = "toggle__label";
  lab.textContent = ctrl.label;
  lab.setAttribute("for", btn.id);

  function toggle(){
    if (btn.disabled) return;
    var next = !currentParams()[ctrl.key];
    currentParams()[ctrl.key] = next;
    btn.classList.toggle("is-on", next);
    btn.setAttribute("aria-checked", next ? "true" : "false");
    onParamChange();
  }
  btn.addEventListener("click", toggle);
  /* <label for="..."> only forwards clicks to <input> elements, not to
     <button>. Wire the click on the label to the same toggle handler so the
     "click the word" affordance actually works. */
  lab.addEventListener("click", function(e){ e.preventDefault(); toggle(); });

  row.appendChild(lab);
  row.appendChild(btn);
  return row;
}

function makeSource(){
  /* No image → return null so buildControls can skip the whole Source section.
     The dropzone on the canvas is the CTA in that state; a second "Choose an
     image" button in the panel just duplicated it. Once an image is loaded
     the panel row appears with the thumb + Replace, which is meaningful. */
  if (!state.image) return null;

  var wrap = document.createElement("div");
  var row = document.createElement("div");
  row.className = "source";

  var thumb = document.createElement("img");
  thumb.className = "source__thumb";
  thumb.src = state.image.src;
  thumb.alt = "";
  /* Explicit dims prevent layout shift while the src decodes — the CSS box
     is already 32×32 so this is a no-op visually. */
  thumb.width = 32;
  thumb.height = 32;

  var meta = document.createElement("div");
  meta.className = "source__meta";
  var nm = document.createElement("span");
  nm.className = "source__name";
  nm.textContent = state.imageName;
  var dm = document.createElement("span");
  dm.className = "source__dims";
  dm.textContent = state.imageDims;
  meta.appendChild(nm);
  meta.appendChild(dm);

  var act = document.createElement("button");
  act.type = "button";
  act.className = "source__action";
  act.textContent = "Replace";
  act.addEventListener("click", function(){ el("fileInput").click(); });

  row.appendChild(thumb);
  row.appendChild(meta);
  row.appendChild(act);
  wrap.appendChild(row);
  return wrap;
}

function makeImport(){
  var wrap = document.createElement("div");
  wrap.style.display = "flex";
  wrap.style.flexDirection = "column";
  wrap.style.gap = "8px";

  var row = document.createElement("div");
  row.className = "import";

  var input = document.createElement("input");
  input.type = "url";
  input.className = "input";
  input.inputMode = "url";
  input.name = "shadergradient-url";
  input.autocomplete = "off";
  input.spellcheck = false;
  input.placeholder = "shadergradient.co URL…";
  input.setAttribute("aria-label", "shadergradient.co URL");

  var btn = document.createElement("button");
  btn.type = "button";
  btn.className = "import__btn";
  btn.textContent = "Import";

  var report = document.createElement("span");
  report.className = "import__report";
  report.hidden = true;

  btn.addEventListener("click", function(){
    var res = importFromUrl(input.value);
    report.hidden = false;
    report.textContent = res.message;
    if (res.count > 0) {
      buildControls();
      render(true);
    }
  });

  input.addEventListener("keydown", function(e){
    if (e.key === "Enter") { e.preventDefault(); btn.click(); }
  });

  row.appendChild(input);
  row.appendChild(btn);
  wrap.appendChild(row);
  wrap.appendChild(report);
  return wrap;
}

function makePresets(){
  var eff = currentEffect();
  var s = makeSection("Presets");

  var box = document.createElement("div");
  box.className = "presets";

  var names = Object.keys(allPresets(eff.id));
  var active = state.activePreset[eff.id];
  var dirty = dirtyKeys();

  var row = null;
  for (var i = 0; i < names.length; i++) {
    if (i % 2 === 0) {
      row = document.createElement("div");
      row.className = "presets__row";
      box.appendChild(row);
    }
    (function(name){
      var isUser = Object.prototype.hasOwnProperty.call(
        state.userPresets[eff.id] || {}, name);
      var b = document.createElement("button");
      b.type = "button";
      var isActive = (name === active);
      b.className = "preset" +
        (isActive ? " is-active" : "") +
        (isActive && dirty.length ? " is-dirty" : "") +
        (isUser ? " is-user" : "");
      b.setAttribute("aria-pressed", isActive ? "true" : "false");
      if (isUser) b.title = "Press Delete to remove this preset";
      var t = document.createElement("span");
      t.textContent = name;
      var d = document.createElement("span");
      d.className = "preset__dot";
      b.appendChild(t);
      b.appendChild(d);

      /* The × on user presets. A <span>, not a nested <button>, and its click
         handler stops propagation so applyPreset does not also fire. Keyboard
         users get the same via Delete on the focused chip (title hints). */
      var del = null;
      if (isUser) {
        del = document.createElement("span");
        del.className = "preset__delete";
        del.textContent = "×";
        del.setAttribute("aria-label", "Delete preset " + name);
        del.title = "Delete";
        b.appendChild(del);
      }

      b.addEventListener("click", function(e){
        if (del && (e.target === del)) {
          e.stopPropagation();
          deleteUserPreset(name);
          return;
        }
        applyPreset(name);
      });

      if (isUser) {
        b.addEventListener("keydown", function(e){
          if (e.key === "Delete" || e.key === "Backspace") {
            e.preventDefault();
            deleteUserPreset(name);
          }
        });
      }
      row.appendChild(b);
    })(names[i]);
  }

  /* Odd preset count → tuck a spacer into the last preset row so the grid
     stays two-up. The action row (Random / Save) is always its own row below,
     so those two buttons keep a stable position regardless of how many
     presets an effect has. */
  if (names.length % 2 === 1) {
    var spacer = document.createElement("span");
    spacer.style.flex = "1";
    row.appendChild(spacer);
  }

  /* Action row — Random + Save. Random is on the left ("get me something
     new") reading left-to-right into Save ("keep this one"), matching the
     workflow. Both dashed, same visual weight — actions, not presets. */
  var actionRow = document.createElement("div");
  actionRow.className = "presets__row";

  var rand = document.createElement("button");
  rand.type = "button";
  rand.className = "preset preset--save";
  rand.textContent = "↻ Random";
  rand.title = "Randomise every parameter (colours included)";
  rand.addEventListener("click", randomiseCurrent);
  actionRow.appendChild(rand);

  var save = document.createElement("button");
  save.type = "button";
  save.className = "preset preset--save";
  save.textContent = "+ Save";
  save.addEventListener("click", saveCurrentAsPreset);
  actionRow.appendChild(save);

  box.appendChild(actionRow);

  var status = document.createElement("div");
  status.className = "presets__status";
  var note = document.createElement("span");
  note.className = "presets__note";
  var revert = document.createElement("button");
  revert.type = "button";
  revert.className = "presets__revert";
  revert.textContent = "Revert";
  revert.addEventListener("click", function(){ applyPreset(state.activePreset[state.effect]); });

  if (dirty.length) {
    note.textContent = "Edited — " + dirty.length + (dirty.length === 1 ? " value differs" : " values differ");
    revert.hidden = false;
  } else if (active) {
    note.textContent = active;
    revert.hidden = true;
  } else {
    /* Random state — no preset active, nothing to revert to. Say so plainly
       instead of leaving the row empty (which reads as a bug). */
    note.textContent = "Random";
    revert.hidden = true;
  }

  status.appendChild(note);
  status.appendChild(revert);

  s.appendChild(box);
  s.appendChild(status);
  return s;
}

function buildControls(){
  var eff = currentEffect();
  controlsEl.innerHTML = "";
  controlsEl.appendChild(makePresets());

  for (var i = 0; i < eff.sections.length; i++) {
    var sec = eff.sections[i];
    var node = makeSection(sec.legend, sec.hint);
    var built_any = false;
    for (var j = 0; j < sec.controls.length; j++) {
      var c = sec.controls[j];
      var built = null;
      if (c.type === "range")       built = makeRange(c);
      else if (c.type === "color")  built = makeColor(c);
      else if (c.type === "select") built = makeSelect(c);
      else if (c.type === "toggle") built = makeToggle(c);
      else if (c.type === "source") built = makeSource();
      else if (c.type === "import") built = makeImport();
      if (built) {
        if (c.activeWhen) {
          built.setAttribute("data-active-key", c.activeWhen.key);
          built.setAttribute("data-active-val", c.activeWhen.value);
        }
        node.appendChild(built);
        built_any = true;
      }
    }
    /* Skip a section that ended up with only a legend (e.g. Source when no
       image is loaded — the dropzone covers that state elsewhere). */
    if (built_any) controlsEl.appendChild(node);
  }
  syncControlStates();
  buildExport();
}

function buildExport(){
  var eff = currentEffect();
  exportEl.innerHTML = "";

  if (state.recording) {
    var legend = document.createElement("h2");
    legend.className = "section__legend";
    legend.textContent = "Export";

    var head = document.createElement("div");
    head.className = "ctrl__head";
    var lab = document.createElement("span");
    lab.className = "ctrl__label";
    lab.textContent = "Recording loop";
    var val = document.createElement("span");
    val.className = "ctrl__value";
    val.id = "recValue";
    val.textContent = "0.0 / " + currentParams().loopDuration.toFixed(1) + "s";
    head.appendChild(lab);
    head.appendChild(val);

    var prog = document.createElement("div");
    prog.className = "progress";
    var fill = document.createElement("div");
    fill.className = "progress__fill";
    fill.id = "recFill";
    var rest = document.createElement("div");
    rest.className = "progress__rest";
    prog.appendChild(fill);
    prog.appendChild(rest);

    var cancel = document.createElement("button");
    cancel.type = "button";
    cancel.className = "btn btn--secondary";
    cancel.style.width = "100%";
    cancel.textContent = "Cancel";
    cancel.addEventListener("click", cancelRecording);

    exportEl.appendChild(legend);
    exportEl.appendChild(head);
    exportEl.appendChild(prog);
    exportEl.appendChild(cancel);
    return;
  }

  var lg = document.createElement("h2");
  lg.className = "section__legend";
  lg.textContent = "Export";

  /* Reuses the effect switch's segmented control rather than inventing a
     second one — same shape, same affordance, no new CSS. */
  var ratios = document.createElement("div");
  ratios.className = "switch__row";
  ratios.setAttribute("role", "group");
  ratios.setAttribute("aria-label", "Aspect ratio");
  for (var i = 0; i < RATIOS.length; i++) {
    (function(r){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "switch__seg" + (r.id === state.ratio ? " is-active" : "");
      b.textContent = r.label;
      b.setAttribute("aria-pressed", r.id === state.ratio ? "true" : "false");
      /* Purpose surfaces on hover / long-press without crowding the label
         row — the tight 4-segment layout has no room for inline captions. */
      b.title = r.label + " · " + r.purpose;
      b.addEventListener("click", function(){ setRatio(r.id); });
      ratios.appendChild(b);
    })(RATIOS[i]);
  }

  var row = document.createElement("div");
  row.className = "export__row";

  /* An image effect with no image can't produce a still — disable rather than
     letting the click hit the error branch, so the button state matches
     whether the action is available. */
  var stillReady = !(eff.needsImage && !state.image);

  var still = document.createElement("button");
  still.type = "button";
  still.className = "btn " + (eff.animated ? "btn--secondary" : "btn--primary");
  still.textContent = "Still";
  still.disabled = !stillReady;
  still.addEventListener("click", exportStill);

  var loop = document.createElement("button");
  loop.type = "button";
  loop.className = "btn " + (eff.animated ? "btn--primary" : "btn--secondary");
  loop.textContent = "Loop";
  loop.disabled = !eff.animated || !recorderSupported();
  loop.addEventListener("click", startRecording);

  row.appendChild(still);
  row.appendChild(loop);

  var meta = document.createElement("span");
  meta.className = "export__meta";
  meta.textContent = exportMetaText();

  exportEl.appendChild(lg);
  exportEl.appendChild(ratios);
  exportEl.appendChild(row);
  exportEl.appendChild(meta);
}

/* Stills carry the full export size; the loop is whatever the preview buffer
   is, since MediaRecorder captures that canvas directly. Saying so is the
   only way the sizes are knowable from the UI. */
function exportMetaText(){
  var eff = currentEffect();
  var d = exportDims();
  var still = "PNG " + d.w + "×" + d.h;
  if (eff.needsImage && !state.image) return still + "  ·  Add an image to enable";
  if (!eff.animated) return still + "  ·  Loop needs a moving effect";
  if (!recorderSupported()) return still + "  ·  Video capture unsupported here";
  /* Loop pixels are fixed per ratio (RATIOS[i].lw/lh), not window-dependent
     any more — see loopDims / startRecording. */
  var l = loopDims();
  return still + "  ·  " + recorderLabel() + " " + l.w + "×" + l.h +
         " " + EXPORT_FPS + "fps " + currentParams().loopDuration.toFixed(1) + "s";
}

/* ============================================================================
   PRESET ACTIONS
   ============================================================================ */

function applyPreset(name){
  var snap = presetSnapshot(state.effect, name);
  if (!snap) return;

  /* Reverting to the active preset IS a discard — that is what Revert means —
     so the guard only fires when the user is switching to a different preset
     and would silently lose edits. Effect switching is unaffected because
     state.params[id] is kept per effect, so leaving Gradient with edits and
     coming back does not lose anything. */
  var isRevert = (name === state.activePreset[state.effect]);
  if (!isRevert) {
    var dirty = dirtyKeys();
    if (dirty.length) {
      var msg = "Discard " + dirty.length +
        (dirty.length === 1 ? " edited value" : " edited values") +
        " and switch to \"" + name + "\"?";
      if (!window.confirm(msg)) return;
    }
  }

  clearErrorStatus();
  var p = currentParams();
  /* Backfill first, so a preset always lands as a complete snapshot. User
     presets saved to localStorage before a param existed have no value for it;
     without this they would silently inherit whatever is currently set, and
     the same preset would apply differently depending on what preceded it. A
     preset that predates a param means the default for it. */
  var defs = currentEffect().defaults;
  for (var dk in defs) {
    if (Object.prototype.hasOwnProperty.call(defs, dk) &&
        !Object.prototype.hasOwnProperty.call(snap, dk)) p[dk] = defs[dk];
  }
  for (var k in snap) {
    if (Object.prototype.hasOwnProperty.call(snap, k)) p[k] = snap[k];
  }
  state.activePreset[state.effect] = name;
  buildControls();
  render(true);
}

function saveCurrentAsPreset(){
  var name = window.prompt("Name this preset");
  if (!name) return;
  name = name.trim();
  if (!name) return;

  var builtins = EFFECTS[state.effect].presets;
  if (Object.prototype.hasOwnProperty.call(builtins, name)) {
    showStatus("\"" + name + "\" is a built-in preset name for this effect — choose another.", "error");
    return;
  }

  var userForEffect = state.userPresets[state.effect] || {};
  if (Object.prototype.hasOwnProperty.call(userForEffect, name)) {
    if (!window.confirm("Overwrite the existing preset \"" + name + "\"?")) return;
  }

  if (!state.userPresets[state.effect]) state.userPresets[state.effect] = {};
  state.userPresets[state.effect][name] = Object.assign({}, currentParams());
  state.activePreset[state.effect] = name;
  saveUserPresets();
  buildControls();
  showStatus("Saved preset \"" + name + "\".", "success");
}

/* Random preset — walk the active effect's declared sections and roll a new
   value for every parameter. Skips `colors` and `colorMode`, since those gate
   which controls are visible (randomising them would churn the panel shape on
   every click). Skips typeless controls (Source, Import) — they aren't params.
   Ranges snap to their `step`; selects pick a random option; colours are
   HSL-sampled in a usable band so the results aren't a 90s test pattern. */
function randomiseCurrent(){
  var eff = currentEffect();
  var p = currentParams();

  /* Skip any select that other controls gate through activeWhen — rolling it
     would change which rows are visible on every click. Derived from the
     effect's own declarations, not a hard-coded name list, so a new gating
     select works without patching this. */
  var gates = {};
  for (var gsi = 0; gsi < eff.sections.length; gsi++) {
    var gsc = eff.sections[gsi].controls;
    for (var gci = 0; gci < gsc.length; gci++) {
      if (gsc[gci].activeWhen) gates[gsc[gci].activeWhen.key] = true;
    }
  }

  for (var si = 0; si < eff.sections.length; si++) {
    var controls = eff.sections[si].controls;
    for (var ci = 0; ci < controls.length; ci++) {
      var c = controls[ci];
      if (!c.key || gates[c.key]) continue;
      if (c.type === "range") {
        var v = c.min + Math.random() * (c.max - c.min);
        if (c.step) v = Math.round(v / c.step) * c.step;
        p[c.key] = clamp(v, c.min, c.max);
      } else if (c.type === "select") {
        var pick = c.options[Math.floor(Math.random() * c.options.length)];
        p[c.key] = pick.value;
      } else if (c.type === "color") {
        p[c.key] = randomHexColor();
      } else if (c.type === "toggle") {
        p[c.key] = Math.random() < 0.5;
      }
    }
  }
  /* No preset matches a random state — clear the active pointer so the label
     under the grid reads "Random" and no preset chip stays highlighted. */
  state.activePreset[state.effect] = null;
  clearErrorStatus();
  buildControls();
  render(true);
  showStatus("Randomised — Save if you want to keep it.", "info");
}

function deleteUserPreset(name){
  var effId = state.effect;
  var userForEffect = state.userPresets[effId] || {};
  /* Only user presets can be deleted — the button never appears on built-ins,
     but the keyboard path could reach one if the check moved. Guard it. */
  if (!Object.prototype.hasOwnProperty.call(userForEffect, name)) return;
  if (!window.confirm("Delete preset \"" + name + "\"?")) return;

  delete userForEffect[name];
  state.userPresets[effId] = userForEffect;
  saveUserPresets();

  /* If we just deleted the active preset, fall back to the first built-in so
     the "active preset" label under the grid never points at nothing. */
  if (state.activePreset[effId] === name) {
    state.activePreset[effId] = Object.keys(EFFECTS[effId].presets)[0];
  }

  buildControls();
  showStatus("Deleted preset \"" + name + "\".", "success");
}

/* ============================================================================
   URL IMPORT (shadergradient.co)
   Only a handful of a shadergradient URL's parameters map onto a 2D app.
   The report says exactly what came across rather than implying it all did.
   ============================================================================ */

function importFromUrl(raw){
  if (!raw || !raw.trim()) return { count: 0, message: "Paste a shadergradient.co customize URL." };

  var qs = raw.indexOf("?") >= 0 ? raw.substring(raw.indexOf("?") + 1) : raw;
  var params;
  try {
    params = new URLSearchParams(qs);
  } catch (e) {
    return { count: 0, message: "That URL couldn’t be read — paste a full shadergradient.co customize link." };
  }

  var map = [
    { from: "color1",   to: "color1",   kind: "color" },
    { from: "color2",   to: "color2",   kind: "color" },
    { from: "color3",   to: "color3",   kind: "color" },
    { from: "uSpeed",   to: "speed",    kind: "number", min: 0.05, max: 1.5 },
    { from: "uStrength",to: "strength", kind: "number", min: 0,    max: 8 },
    { from: "uDensity", to: "density",  kind: "number", min: 0.2,  max: 3 },
    { from: "grain",    to: "grain",    kind: "onoff" }
  ];

  var p = state.params.gradient;
  var taken = [];
  var seen = 0;

  for (var i = 0; i < map.length; i++) {
    var m = map[i];
    if (!params.has(m.from)) continue;
    var v = params.get(m.from);
    seen++;
    if (m.kind === "color") {
      var hex = decodeURIComponent(v);
      if (/^#?[0-9a-fA-F]{6}$/.test(hex)) {
        p[m.to] = hex.charAt(0) === "#" ? hex : ("#" + hex);
        taken.push(m.to);
      }
    } else if (m.kind === "number") {
      var n = parseFloat(v);
      if (!isNaN(n)) { p[m.to] = clamp(n, m.min, m.max); taken.push(m.to); }
    } else if (m.kind === "onoff") {
      p[m.to] = (v === "on" || v === "true" || v === "1");
      taken.push(m.to);
    }
  }

  /* A shadergradient URL always describes three colours, so importing one has
     to restore the third slot — otherwise importing while set to two colours
     would take color3 across and then not show it. */
  if (taken.indexOf("color3") >= 0) p.colors = "3";

  var total = 0;
  params.forEach(function(){ total++; });

  if (!taken.length) {
    return { count: 0, message: "No colours or numbers found in that URL — check the link is from shadergradient.co/customize." };
  }

  var ignored = total - seen;
  var msg = "Imported " + taken.length + " of " + total + " values: " + taken.join(", ") + ".";
  if (ignored > 0) {
    msg += " " + ignored + " ignored — mostly 3D camera and geometry settings this app doesn’t have.";
  }
  return { count: taken.length, message: msg };
}

/* ============================================================================
   EFFECT SWITCHING
   ============================================================================ */

var glCanvas = el("glview");
var c2dCanvas = el("c2dview");
var dropzone = el("dropzone");
var artboard = el("artboard");
var frameEl = el("frame");

/* Ratio is global, so switching it only reshapes the frame — the effect,
   its params and its preset all carry over untouched. */
function setRatio(id){
  if (state.ratio === id || state.recording) return;
  state.ratio = ratioById(id).id;
  saveRatio();
  fitPreview();
  buildExport();
  syncMeta();
  render(true);
}

function setEffect(id){
  if (!EFFECTS[id]) return;
  clearErrorStatus();
  if (state.recording) cancelRecording();
  state.effect = id;
  /* Remember this effect as the last-active for its group, so mode-tabbing
     returns here. Group.id (not label) is the key, so a label rename doesn't
     strand state in localStorage. */
  state.lastEffectInMode[groupOfEffect(id).id] = id;
  buildSwitch();
  buildControls();
  syncStage();
  render(true);
}

/* The readout under the frame states the file that will come out, not the
   size of the preview. `glFailed` keeps the WebGL error message in place. */
var glFailed = false;

function syncMeta(){
  if (glFailed) return;
  var d = exportDims();
  el("metaDims").textContent = d.w + " × " + d.h;
  el("metaRatio").textContent = currentRatio().label;
}

function syncStage(){
  var eff = currentEffect();
  var useGL = (eff.id === "gradient");

  glCanvas.style.display = useGL ? "block" : "none";
  c2dCanvas.style.display = useGL ? "none" : "block";

  var needsDrop = eff.needsImage && !state.image;
  dropzone.classList.toggle("is-on", needsDrop);
  el("dropzoneTitle").textContent = "Drop an image to " + (eff.id === "ascii" ? "convert" : "dither");

  /* Name the artboard for assistive tech — a bare <canvas> is opaque to
     screen readers, so role="img" + aria-label on the wrapper is what
     announces "what am I looking at". */
  var artboardLabel = eff.needsImage && !state.image
    ? "Drop an image to " + eff.label.toLowerCase()
    : eff.label + " — live preview";
  artboard.setAttribute("aria-label", artboardLabel);

  el("transport").style.display = eff.animated ? "flex" : "none";
  syncMeta();
  var mf = el("metaFile");
  if (eff.needsImage && state.image) {
    mf.classList.remove("hidden");
    mf.textContent = state.imageName;
  } else {
    mf.classList.add("hidden");
  }
}

/* ============================================================================
   RENDER LOOP
   ============================================================================ */

var previewW = 680;
var previewH = 680;

/* Sizes the frame to the chosen ratio — largest that fits the available area
   — and gives the backing store the same shape. Preview and export now agree,
   so loop capture records exactly what is on screen. Nothing is rendered off
   the edge any more; the old hidden slice is gone with the square. */
function fitPreview(){
  var r = currentRatio();
  var box = frameEl.getBoundingClientRect();
  var availW = Math.max(64, box.width);

  /* Below the breakpoint the fit box takes its height from the artboard we
     are about to size, so measuring it would feed back. Budget from the
     viewport instead. */
  var narrow = window.matchMedia && window.matchMedia("(max-width:900px)").matches;
  var availH = narrow
    ? Math.max(200, Math.min(window.innerHeight * 0.68, 720))
    : Math.max(64, box.height);

  var scale = Math.min(availW / r.w, availH / r.h);
  var cssW = Math.max(64, Math.floor(r.w * scale));
  var cssH = Math.max(64, Math.floor(r.h * scale));

  artboard.style.width = cssW + "px";
  artboard.style.height = cssH + "px";

  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  previewW = even(cssW * dpr);
  previewH = even(cssH * dpr);
}

function render(force){
  var eff = currentEffect();
  var p = currentParams();
  if (eff.id === "gradient") {
    drawGradient(glCanvas, previewW, previewH, p, state.phase);
  } else if (eff.id === "gdots") {
    drawGradientDots(c2dCanvas, previewW, previewH, p, state.phase);
  } else if (eff.id === "gchars") {
    drawGradientChars(c2dCanvas, previewW, previewH, p, state.phase);
  } else if (eff.id === "dissolve") {
    drawDissolve(c2dCanvas, previewW, previewH, p, state.phase);
  } else if (eff.id === "dither") {
    drawDither(c2dCanvas, previewW, previewH, p, state.image);
  } else if (eff.id === "ascii") {
    drawAscii(c2dCanvas, previewW, previewH, p, state.image);
  }
}

/* Whichever canvas is currently on screen — export and capture must follow
   the active effect, not always the WebGL one. */
function activeCanvas(){
  return currentEffect().id === "gradient" ? glCanvas : c2dCanvas;
}

var rafId = 0;

/* Cached at module scope so the RAF tick doesn't re-query the DOM 60Hz. Same
   pattern as statusEl. recFill/recValue only exist while recording — resolved
   lazily on first record tick and cleared on finishRecording. */
var loopTimeEl = el("loopTime");
var lastLoopTimeText = "";
var recFillEl = null;
var recValueEl = null;
var lastRecValueText = "";

function tick(t){
  rafId = requestAnimationFrame(tick);
  var eff = currentEffect();

  if (!eff.animated) return;

  if (!state.lastT) state.lastT = t;
  var dt = (t - state.lastT) / 1000;
  state.lastT = t;

  if (state.playing) {
    var dur = currentParams().loopDuration;
    state.phase += dt / dur;
    if (state.phase >= 1) state.phase -= Math.floor(state.phase);
    var txt = fmtTime(state.phase * dur);
    if (txt !== lastLoopTimeText) {
      loopTimeEl.textContent = txt;
      lastLoopTimeText = txt;
    }
    render(false);
  }

  if (state.recording) updateRecordingUI(dt);
}

function onParamChange(){
  clearErrorStatus();
  var eff = currentEffect();
  if (!eff.animated || !state.playing) render(true);
  updatePresetStatus();
  if (eff.animated) refreshExportMeta();
}

function refreshExportMeta(){
  if (state.recording) return;
  var meta = exportEl.querySelector(".export__meta");
  if (!meta) return;
  /* Compare before writing — only loopDuration (and ratio, but that goes through
     setRatio) changes this string, so most slider drags produce the same text.
     The read is cheap; the DOM write is what we're avoiding. */
  var next = exportMetaText();
  if (meta.textContent !== next) meta.textContent = next;
}

/* Repaint only the preset status strip, so dragging a slider doesn't
   rebuild the whole panel and steal focus mid-drag. */
function updatePresetStatus(){
  var dirty = dirtyKeys();
  var activeBtn = controlsEl.querySelector(".preset.is-active");
  if (activeBtn) activeBtn.classList.toggle("is-dirty", dirty.length > 0);

  var note = controlsEl.querySelector(".presets__note");
  var revert = controlsEl.querySelector(".presets__revert");
  if (!note || !revert) return;

  if (dirty.length) {
    note.textContent = "Edited — " + dirty.length + (dirty.length === 1 ? " value differs" : " values differ");
    revert.hidden = false;
  } else {
    /* Null activePreset = random state; matches the initial paint in makePresets. */
    note.textContent = state.activePreset[state.effect] || "Random";
    revert.hidden = true;
  }
}

/* ============================================================================
   IMAGE LOADING
   ============================================================================ */

/* Above this pixel count Dither's O(w·h) pass at 4K starts to stall the tab
   noticeably. Warn rather than downscale — the user might still want the
   detail, and it's their file. */
var LARGE_IMAGE_PIXELS = 12000000;

function loadImageFile(file){
  if (!file || !/^image\//.test(file.type)) {
    showStatus("That file isn’t an image — JPG, PNG or WebP.", "error");
    return;
  }
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      state.image = img;
      state.imageName = file.name;
      state.imageDims = (img.naturalWidth || img.width) + " × " + (img.naturalHeight || img.height);
      var mp = (img.naturalWidth || img.width) * (img.naturalHeight || img.height);
      if (mp > LARGE_IMAGE_PIXELS) {
        showStatus("Large image (" + Math.round(mp/1000000) + " megapixels) — Dither and ASCII exports may take a moment.", "info");
      } else {
        clearErrorStatus();
      }
      syncStage();
      buildControls();
      render(true);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

el("fileInput").addEventListener("change", function(e){
  if (e.target.files && e.target.files[0]) loadImageFile(e.target.files[0]);
  e.target.value = "";
});

el("dropzoneBtn").addEventListener("click", function(){ el("fileInput").click(); });

["dragenter","dragover"].forEach(function(evt){
  artboard.addEventListener(evt, function(e){
    if (!currentEffect().needsImage) return;
    e.preventDefault();
    dropzone.classList.add("is-hover");
  });
});
["dragleave","drop"].forEach(function(evt){
  artboard.addEventListener(evt, function(e){
    e.preventDefault();
    dropzone.classList.remove("is-hover");
  });
});
artboard.addEventListener("drop", function(e){
  if (!currentEffect().needsImage) return;
  e.preventDefault();
  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) {
    loadImageFile(e.dataTransfer.files[0]);
  }
});

/* ============================================================================
   STATUS LINE
   One in-app message surface (#statusLine, near the Export footer). info and
   success clear themselves after a few seconds; error stays until the next
   user action clears it. role="status" means it is announced.
   ============================================================================ */

var statusEl = el("statusLine");
var statusTimer = 0;

function showStatus(text, kind){
  kind = kind || "info";
  clearTimeout(statusTimer);
  statusEl.textContent = text;
  statusEl.className = "status status--" + kind;
  statusEl.hidden = false;
  if (kind !== "error") statusTimer = setTimeout(hideStatus, 3200);
}

function hideStatus(){
  clearTimeout(statusTimer);
  statusEl.hidden = true;
  statusEl.textContent = "";
  statusEl.className = "status";
}

/* Called from the handlers for the actions that count as "the next action" —
   an error message should not outlive the thing the user does after seeing it. */
function clearErrorStatus(){
  if (statusEl.classList.contains("status--error")) hideStatus();
}

/* ============================================================================
   EXPORT — STILL
   ============================================================================ */

function exportStill(){
  var eff = currentEffect();
  var p = currentParams();
  var d = exportDims();

  if (eff.needsImage && !state.image) {
    showStatus("Add an image before exporting.", "error");
    return;
  }

  showStatus("Exporting still…", "info");

  /* Deferred a turn so the status line paints before a large Dither or ASCII
     render blocks the thread. Generative renders are fast enough not to need
     it, but the one code path is simpler. */
  setTimeout(function(){
    var out = document.createElement("canvas");

    if (eff.id === "gradient") {
      /* Render the gradient at export size on the live GL canvas, grab it,
         then restore the preview size. */
      var prevW = glCanvas.width, prevH = glCanvas.height;
      drawGradient(glCanvas, d.w, d.h, p, state.phase);
      out.width = d.w;
      out.height = d.h;
      out.getContext("2d").drawImage(glCanvas, 0, 0);
      glCanvas.width = prevW;
      glCanvas.height = prevH;
      drawGradient(glCanvas, previewW, previewH, p, state.phase);
    } else if (eff.id === "gdots") {
      drawGradientDots(out, d.w, d.h, p, state.phase);
    } else if (eff.id === "gchars") {
      drawGradientChars(out, d.w, d.h, p, state.phase);
    } else if (eff.id === "dissolve") {
      drawDissolve(out, d.w, d.h, p, state.phase);
    } else if (eff.id === "dither") {
      drawDither(out, d.w, d.h, p, state.image);
    } else if (eff.id === "ascii") {
      drawAscii(out, d.w, d.h, p, state.image);
    }

    var name = "degradient-" + eff.id + "-" + ratioSlug() + "-" + stamp() + ".png";
    out.toBlob(function(blob){
      if (blob) {
        download(blob, name);
        showStatus("Saved " + name, "success");
      } else {
        showStatus("Couldn't create the PNG — the frame may be too large for this browser.", "error");
      }
    }, "image/png");
  }, 0);
}

/* ============================================================================
   EXPORT — LOOP
   MediaRecorder only; no encoder library, so the file stays offline-capable.
   MP4 is preferred where the browser can produce it, webm otherwise.
   ============================================================================ */

var MIME_CANDIDATES = [
  { mime: "video/mp4;codecs=avc1.42E01E", label: "MP4", ext: "mp4" },
  { mime: "video/mp4", label: "MP4", ext: "mp4" },
  { mime: "video/webm;codecs=vp9", label: "WEBM", ext: "webm" },
  { mime: "video/webm;codecs=vp8", label: "WEBM", ext: "webm" },
  { mime: "video/webm", label: "WEBM", ext: "webm" }
];

/* Picked once — MediaRecorder support is a browser-session property, and this
   was firing three times per slider drag through exportMetaText → recorderSupported
   + recorderLabel + pickMime, each iterating the candidate list. */
var MIME_CHOICE = (function(){
  if (typeof MediaRecorder === "undefined") return null;
  for (var i = 0; i < MIME_CANDIDATES.length; i++) {
    try {
      if (MediaRecorder.isTypeSupported(MIME_CANDIDATES[i].mime)) return MIME_CANDIDATES[i];
    } catch (e) { /* isTypeSupported can throw on malformed strings */ }
  }
  return null;
})();

function recorderSupported(){ return MIME_CHOICE !== null; }
function recorderLabel(){ return MIME_CHOICE ? MIME_CHOICE.label : "—"; }

var rec = {
  recorder: null, chunks: [], elapsed: 0, target: 0, choice: null,
  prevPlaying: true,
  /* Closure returned by usePreviewSize that undoes its swap. Held here so
     finishRecording can call it from the onstop path, and either startRecording
     catch path can call it before bailing. Cleared to null once used. */
  restorePreview: null
};

/* Swap the preview buffer to a target size and return a `restore()` closure.
   Recording spans many RAF frames — the tick reads previewW/H every frame — so
   we can't wrap it in a lexical `with` scope; the returned closure gives
   startRecording a single reversible handle to pass around and cleans up the
   three save/restore repetitions the old code had. */
function usePreviewSize(w, h){
  var pw = previewW, ph = previewH;
  previewW = w; previewH = h;
  render(true);
  return function restore(){
    previewW = pw; previewH = ph;
    render(true);
  };
}

function startRecording(){
  var eff = currentEffect();
  /* The Loop button is disabled when these are true, so the return is defensive
     — no need for status since the user can't get here through the UI. */
  if (!eff.animated || state.recording) return;

  var choice = MIME_CHOICE;
  if (!choice) {
    showStatus("Video capture isn't supported in this browser. Try Chrome, Edge or a recent Firefox.", "error");
    return;
  }

  /* Loop pixels are fixed per ratio (RATIOS[i].lw/lh) rather than window-
     dependent — swap the preview buffer to those dimensions BEFORE
     captureStream so the video track locks onto the loop size. CSS
     object-fit:contain keeps the visible frame the same physical size; only
     the pixel density changes for the duration of the recording. */
  var loop = loopDims();
  var restore = usePreviewSize(loop.w, loop.h);

  var stream;
  try {
    stream = activeCanvas().captureStream(EXPORT_FPS);
  } catch (e) {
    restore();
    showStatus("Couldn't capture the canvas for recording — the browser blocked it.", "error");
    return;
  }

  rec.chunks = [];
  rec.elapsed = 0;
  rec.target = currentParams().loopDuration;
  rec.choice = choice;
  rec.prevPlaying = state.playing;

  try {
    rec.recorder = new MediaRecorder(stream, { mimeType: choice.mime });
  } catch (e) {
    restore();
    showStatus("Couldn't start the " + choice.label + " recorder in this browser.", "error");
    return;
  }

  rec.restorePreview = restore;

  rec.recorder.ondataavailable = function(e){
    if (e.data && e.data.size > 0) rec.chunks.push(e.data);
  };
  rec.recorder.onstop = function(){
    var blob = new Blob(rec.chunks, { type: choice.mime });
    if (blob.size > 0) {
      var name = "degradient-loop-" + ratioSlug() + "-" + stamp() + "." + choice.ext;
      download(blob, name);
      showStatus("Saved " + name + "  ·  " + loop.w + "×" + loop.h, "success");
    } else {
      showStatus("Recording produced no data — nothing was saved.", "error");
    }
    finishRecording();
  };

  clearErrorStatus();

  /* Start the loop from its beginning so the captured file is exactly
     one full cycle — that is what makes it seamless. */
  state.phase = 0;
  state.playing = true;
  state.recording = true;
  artboard.classList.add("is-recording");
  el("rec").classList.add("is-on");
  buildExport();

  rec.recorder.start();
}

function updateRecordingUI(dt){
  rec.elapsed += dt;
  var pct = clamp(rec.elapsed / rec.target, 0, 1);
  /* recFill/recValue only exist inside the export block while recording, and
     buildExport rebuilds them on every start/stop. Resolve lazily so the
     tick doesn't have to know about the DOM structure. */
  if (!recFillEl) recFillEl = el("recFill");
  if (!recValueEl) recValueEl = el("recValue");
  if (recFillEl) recFillEl.style.width = (pct * 100) + "%";
  if (recValueEl) {
    var txt = rec.elapsed.toFixed(1) + " / " + rec.target.toFixed(1) + "s";
    if (txt !== lastRecValueText) {
      recValueEl.textContent = txt;
      lastRecValueText = txt;
    }
  }
  if (rec.elapsed >= rec.target) stopRecording();
}

function stopRecording(){
  if (rec.recorder && rec.recorder.state !== "inactive") {
    rec.recorder.stop();
  } else {
    finishRecording();
  }
}

function cancelRecording(){
  if (rec.recorder && rec.recorder.state !== "inactive") {
    rec.recorder.ondataavailable = null;
    rec.recorder.onstop = null;
    try { rec.recorder.stop(); } catch (e) { /* already stopped */ }
  }
  rec.chunks = [];
  finishRecording();
}

function finishRecording(){
  state.recording = false;
  state.playing = rec.prevPlaying;
  rec.recorder = null;
  artboard.classList.remove("is-recording");
  el("rec").classList.remove("is-on");
  if (rec.restorePreview) { rec.restorePreview(); rec.restorePreview = null; }
  /* Clear the cached recording-UI nodes — buildExport tears them down and
     rebuilds fresh ones on the next recording start. */
  recFillEl = null;
  recValueEl = null;
  lastRecValueText = "";
  syncPlayIcon();
  buildExport();
}

/* ============================================================================
   TRANSPORT
   ============================================================================ */

var PAUSE_ICON = '<rect x="0" y="0" width="3" height="10" rx="0.5" fill="var(--color-text)"/><rect x="6" y="0" width="3" height="10" rx="0.5" fill="var(--color-text)"/>';
var PLAY_ICON  = '<path d="M1 0.5L8.5 5L1 9.5Z" fill="var(--color-text)"/>';

function syncPlayIcon(){
  el("playIcon").innerHTML = state.playing ? PAUSE_ICON : PLAY_ICON;
  el("playBtn").setAttribute("aria-label", state.playing ? "Pause" : "Play");
}

function togglePlay(){
  if (state.recording) return;
  var eff = currentEffect();
  if (!eff.animated) return;
  state.playing = !state.playing;
  state.lastT = 0;
  syncPlayIcon();
}
el("playBtn").addEventListener("click", togglePlay);

/* Spacebar as play/pause — a keyboard shortcut every video player has. Skipped
   when focus is in a text field (typing space) or on a button (space activates
   it), and when the current effect isn't animated. preventDefault stops the
   page from scrolling if the panel body has overflow. */
document.addEventListener("keydown", function(e){
  if (e.key !== " " && e.code !== "Space") return;
  var t = document.activeElement;
  if (t) {
    var tag = t.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || tag === "BUTTON") return;
    if (t.isContentEditable) return;
  }
  e.preventDefault();
  togglePlay();
});

/* ============================================================================
   BOOT
   ============================================================================ */

function onResize(){
  /* During recording the preview buffer holds the loop's fixed dimensions —
     don't clobber them by re-fitting to the (now larger or smaller) window,
     that would swap the video track mid-capture and produce a broken file. */
  if (state.recording) return;
  fitPreview();
  render(true);
  /* Preview buffer size no longer affects the recorded loop; the meta line's
     PNG dimensions are the only thing that varies with the ratio switch. */
  refreshExportMeta();
}

var resizeTimer = 0;
window.addEventListener("resize", function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(onResize, 120);
});

function boot(){
  loadUserPresets();
  loadRatio();

  var glOK = initGL(glCanvas);

  /* Set glFailed before buildSwitch so the WebGL-dependent segments start
     disabled — otherwise they would be clickable for one frame and lead to a
     blank canvas. */
  if (!glOK) glFailed = true;

  /* The canvas is animation, so prefers-reduced-motion cannot simply disable
     it. Start paused instead and let the user press play. */
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  state.playing = !reduced;

  /* Ahead of buildControls, since the frame must have its size before the
     first render reads a preview buffer from it. */
  fitPreview();

  buildSwitch();
  buildControls();
  syncStage();
  syncPlayIcon();

  if (glFailed) {
    el("metaDims").textContent = "WebGL unavailable";
    /* Dither, ASCII and Dissolve are Canvas 2D — they still work. Land on
       Dissolve so the app opens on something animated rather than an empty
       dropzone waiting for an upload. */
    setEffect("dissolve");
    showStatus("WebGL is off in this browser — Gradient, Dots and Chars are disabled. Dissolve, Dither and ASCII still work.", "error");
  } else {
    render(true);
  }

  refreshExportMeta();

  el("loopTime").textContent = fmtTime(0);
  rafId = requestAnimationFrame(tick);
}

boot();
</script>
</body>
</html>
