/* ============================================================
   TOKENS
   Light theme — neutral instrument grey. Every chrome colour
   lives here; swapping the whole look is this block alone.

   Two accent tokens, and the split is load-bearing:
     --color-accent      #b0d000  fills ONLY. Anything filled with
                                  it carries --color-on-accent text.
     --color-accent-ink  #647500  the same hue dark enough to survive
                                  as a 1px line or as text on a light
                                  panel. #b0d000 measures ~1.4:1 there
                                  and is effectively invisible.
   Use the wrong one and it either glares or disappears.
   Neither is artwork — artwork colour (#ff5005 ink, gradient
   colours) is separate and must never reference these.
   ============================================================ */
:root{
  --color-ground:#d9d9d9;
  --color-surface:#f2f2f2;
  --color-surface-raised:#e4e4e4;
  --color-seam:#c9c9c9;
  --color-legend:#1a1a1a;
  --color-text:#3d3d3d;
  /* Darkened from #6e6e6e (which measured ~4.55 on --color-surface and
     ~4.17 on --color-surface-raised — the latter fails WCAG AA). #666666
     clears 4.65 on the raised surface and 5.09 on the panel. */
  --color-legend-muted:#666666;
  --color-disabled:#a3a3a3;
  /* The one non-grey chrome colour. A dark brick red for error status only —
     ~7:1 on the panel, quiet enough to sit in the instrument register. Not
     artwork: #ff5005 orange stays reserved for the canvas. */
  --color-danger:#9e2b25;
  --color-accent:#b0d000;
  --color-accent-ink:#647500;
  --color-accent-dim:#cdcdcd;
  --color-on-accent:#191d1a;

  /* Deliberately off the grey ramp: this sits behind the artwork, not
     beside it, so it is true white rather than a chrome surface. */
  --color-canvas-backdrop:#fff;

  /* Tells the browser its own UI (form controls, scrollbars, native selects)
     should render for a light theme regardless of OS dark mode — the app has
     no dark theme, so we don't want a dark scrollbar on the panel body. */
  color-scheme:light;

  --font-display:'Nippo',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --font-ui:'Quantico',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --font-numeric:var(--font-ui);

  --text-micro:11px;
  --text-value:12px;
  --text-label:13px;

  --tracking-legend:.08em;
  --tracking-wordmark:.18em;

  --radius-sm:3px;
  --radius-md:4px;
  --radius-full:999px;

  --space-2:8px;
  --space-3:12px;
  --space-4:16px;
  --space-5:20px;
  --space-6:24px;

  --panel-width:320px;
  --breakpoint-narrow:900px;
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

html,body{height:100%}
body{
  background:var(--color-ground);
  color:var(--color-text);
  font-family:var(--font-ui);
  font-size:var(--text-label);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow:hidden;
  /* Removes the ~300ms tap delay Mobile Safari and older Android WebViews add
     to disambiguate double-tap zoom, and mutes the default blue tap flash. */
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}

:focus-visible{outline:2px solid var(--color-accent-ink);outline-offset:2px}
::selection{background:var(--color-on-accent);color:var(--color-accent)}

/* ============================================================
   SHELL
   ============================================================ */
.app{display:flex;flex-direction:row;width:100%;height:100vh}

.preview{
  display:flex;flex-direction:column;
  flex:1 1 auto;min-width:0;height:100%;
  padding:var(--space-6);background:var(--color-ground);
}

.stage{display:flex;flex-direction:column;gap:var(--space-4);width:100%;height:100%;min-height:0}

/* The fit box is the area available to the artwork; the frame inside it is
   the export itself. fitPreview() measures this box and sets the frame's
   width and height in px so it is exactly the chosen aspect ratio, largest
   that fits, centred. Sizing in JS rather than with `aspect-ratio` is
   deliberate: with both a max-width and a max-height in play, CSS keeps the
   constrained dimension and drops the ratio, which is the one thing that
   must not happen here. */
.frame{
  flex:1 1 auto;min-height:0;
  display:flex;align-items:center;justify-content:center;
}

/* What you see is the file. The backing store carries the same aspect ratio
   as the frame, so `contain` neither crops nor stretches — it only absorbs
   the sub-pixel rounding that keeping the buffer even-numbered introduces. */
.artboard{
  position:relative;
  flex:0 0 auto;
  overflow:hidden;
  background:var(--color-canvas-backdrop);
  border:1px solid var(--color-seam);
  border-radius:var(--radius-sm);
}
.artboard.is-recording{border-color:var(--color-accent-ink)}
.artboard canvas{display:block;width:100%;height:100%;object-fit:contain}
#c2dview{display:none}

.meta{
  display:flex;align-items:center;justify-content:space-between;
  width:100%;gap:var(--space-4);
  font-family:var(--font-numeric);font-size:var(--text-value);
  color:var(--color-legend-muted);letter-spacing:.02em;
}
.meta__group{display:flex;align-items:center;gap:10px}
.meta__rule{width:1px;height:11px;background:var(--color-seam);flex-shrink:0}
.meta__file{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}

.transport{display:flex;align-items:center;gap:var(--space-3)}
.transport__btn{
  display:flex;align-items:center;justify-content:center;
  width:26px;height:26px;flex-shrink:0;cursor:pointer;
  background:var(--color-surface-raised);
  border:1px solid var(--color-seam);border-radius:var(--radius-full);
}
.transport__btn svg{display:block}
.transport__btn:hover{border-color:var(--color-accent-ink)}
/* Readout, not a control — the "0:00" next to Play looks like a scrubber
   otherwise. cursor:default and tabular-nums make it read as a status
   display, and user-select:none stops the drag-to-select gesture. */
.transport__time{
  font-family:var(--font-numeric);font-weight:700;color:var(--color-legend);letter-spacing:.02em;
  font-variant-numeric:tabular-nums;
  cursor:default;user-select:none;
}

/* REC badge */
.rec{
  position:absolute;top:12px;left:12px;
  display:none;align-items:center;gap:7px;height:22px;padding:0 9px;
  background:var(--color-accent);border-radius:var(--radius-full);
}
.rec.is-on{display:flex}
.rec__dot{width:7px;height:7px;border-radius:var(--radius-full);background:var(--color-on-accent);animation:rec-pulse 1s ease-in-out infinite}
.rec__label{font-size:var(--text-micro);font-weight:700;color:var(--color-on-accent);letter-spacing:var(--tracking-legend)}
@keyframes rec-pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* Dropzone / empty state */
.dropzone{
  position:absolute;inset:0;
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:var(--color-surface);
  border:1px dashed var(--color-seam);border-radius:var(--radius-sm);
  text-align:center;padding:24px;
}
.dropzone.is-on{display:flex}
.dropzone.is-hover{border-color:var(--color-accent-ink);background:var(--color-surface-raised)}
.dropzone__title{font-size:17px;font-weight:700;color:var(--color-legend)}
.dropzone__hint{font-size:var(--text-label);color:var(--color-legend-muted)}

/* ============================================================
   PANEL
   ============================================================ */
.panel{
  display:flex;flex-direction:column;
  width:var(--panel-width);flex:0 0 var(--panel-width);
  height:100%;
  background:var(--color-surface);
  border-left:1px solid var(--color-seam);
}

.panel__header{
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;padding:var(--space-5);
  border-bottom:1px solid var(--color-seam);
}
.wordmark{
  font-family:var(--font-display);font-size:var(--text-label);font-weight:700;
  color:var(--color-legend);letter-spacing:var(--tracking-wordmark);
}

   (silhouette from the portfolio favicon, recoloured to --color-legend via

/* Mark is now the PNG used as a MASK over a solid --color-legend fill, so the
   silhouette renders black instead of the portfolio yellow. Colour lives in
   the token, not the asset — one CSS-var change to recolour. */
.panel__mark{position:relative;flex-shrink:0;width:60px;height:30px;
  background:var(--color-legend);
  -webkit-mask-image:var(--logo-mark-url);mask-image:var(--logo-mark-url);
  -webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-position:center;mask-position:center;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
/* Shimmer as a real <span> child rather than a ::after — pseudo-elements
   with mask-image dropped inconsistently under some renderers. Semi-
   transparent accent green over the black mark: the sweep briefly tints the
   silhouette toward the app's own accent, so the mark visibly does what the
   app does — passes through a gradient — every cycle. */
.panel__mark-shimmer{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 38%,rgba(176,208,0,.7) 50%,transparent 62%);
  background-size:260% 100%;background-position:-30% 0;
  -webkit-mask-image:var(--logo-mark-url);mask-image:var(--logo-mark-url);
  -webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-position:center;mask-position:center;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  animation:mark-shimmer 5s ease-in-out infinite;
}
@keyframes mark-shimmer{
  0%{background-position:-30% 0}
  40%{background-position:130% 0}
  100%{background-position:130% 0}
}
/* Reduced motion — pin the shimmer at its rest position (off-screen). */
@media (prefers-reduced-motion:reduce){
  .panel__mark-shimmer{animation:none;background-position:-30% 0}
}

.switch{display:flex;flex-direction:column;flex-shrink:0;gap:10px;padding:14px var(--space-5);border-bottom:1px solid var(--color-seam)}
.switch__row{display:flex;flex-direction:row}
.switch__seg{
  display:flex;align-items:center;justify-content:center;
  flex:1;min-width:0;height:32px;cursor:pointer;
  background:var(--color-surface-raised);
  /* Idle segment reads as text, not legend — muted was ~4.17:1 on the raised
     surface, below WCAG AA. --color-text clears 8.6:1. */
  color:var(--color-text);
  font-family:var(--font-ui);font-size:var(--text-label);font-weight:400;
  border:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.switch__row .switch__seg:first-child{border-radius:var(--radius-sm) 0 0 var(--radius-sm)}
.switch__row .switch__seg:last-child{border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.switch__seg:hover{color:var(--color-legend)}
.switch__seg.is-active{background:var(--color-accent);color:var(--color-on-accent);font-weight:700}
/* Disabled segment — WebGL-dependent effects when WebGL is off. Kept
   clickable so the click can explain what happened; the aria-disabled
   selector is what carries the dim + not-allowed cursor. */
.switch__seg[aria-disabled="true"]{color:var(--color-disabled);cursor:not-allowed}
.switch__seg[aria-disabled="true"]:hover{color:var(--color-disabled)}

.panel__body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px var(--space-5);display:flex;flex-direction:column;gap:13px}
.panel__body::-webkit-scrollbar{width:8px}
.panel__body::-webkit-scrollbar-thumb{background:var(--color-surface-raised);border-radius:var(--radius-full)}
.panel__body::-webkit-scrollbar-track{background:transparent}

.section{display:flex;flex-direction:column;gap:var(--space-2);flex-shrink:0}
.section__legend{
  font-size:var(--text-micro);font-weight:700;
  color:var(--color-legend-muted);letter-spacing:var(--tracking-legend);
  text-transform:uppercase;
}
/* Plain-language explainer under a section legend. Data-driven from
   EFFECTS[…].sections[i].hint — non-coder guidance for controls whose
   effect isn't obvious from the label alone (Strength vs Density, etc.). */
.section__hint{
  font-size:var(--text-micro);
  color:var(--color-legend-muted);
  line-height:1.45;
  margin-top:-2px;
}

/* Control row: label + value */
.ctrl{display:flex;flex-direction:column;gap:5px}
.ctrl__head{display:flex;flex-direction:row;align-items:center;gap:var(--space-2)}
.ctrl__label{flex:1;font-size:var(--text-label);font-weight:400;color:var(--color-text)}
/* Shared base for the two inline editable value fields (.ctrl__value and
   .swatch__hex). Both are transparent, borderless, right-aligned, tabular-num
   inputs that carry a persistent underline so touch and non-hovering users
   see the field IS editable. Focus turns the underline accent-ink. Bolding
   on focus would reflow the digits inside a fixed width and make the value
   jitter, so weight stays constant — only the seam colour changes. */
.field{
  padding:0;text-align:right;flex-shrink:0;
  font-family:var(--font-numeric);letter-spacing:.02em;
  background:transparent;border:0;border-bottom:1px solid var(--color-seam);
  cursor:text;font-variant-numeric:tabular-nums;
}
.field:hover:not(:disabled){border-bottom-color:var(--color-legend-muted)}
.field:focus-visible{border-bottom-color:var(--color-accent-ink);outline:none}

/* Numeric readout in a control row — bold, ink, wider than the hex. */
.ctrl__value{
  width:56px;
  font-size:var(--text-value);font-weight:700;color:var(--color-legend);
}

/* Range */
input[type=range]{
  -webkit-appearance:none;appearance:none;
  width:100%;height:12px;background:transparent;cursor:pointer;display:block;
}
input[type=range]::-webkit-slider-runnable-track{
  height:3px;border-radius:var(--radius-full);
  background:linear-gradient(to right,var(--color-accent) 0 var(--fill,50%),var(--color-accent-dim) var(--fill,50%) 100%);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:12px;height:12px;margin-top:-4.5px;
  border-radius:var(--radius-full);background:var(--color-accent);border:0;
}
input[type=range]::-moz-range-track{height:3px;border-radius:var(--radius-full);background:var(--color-accent-dim)}
input[type=range]::-moz-range-progress{height:3px;border-radius:var(--radius-full);background:var(--color-accent)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:var(--radius-full);background:var(--color-accent)}

/* Color swatch row */
.swatch{display:flex;flex-direction:row;align-items:center;gap:10px}
.swatch__chip{
  width:22px;height:22px;flex-shrink:0;padding:0;cursor:pointer;
  border:1px solid var(--color-seam);border-radius:var(--radius-sm);
  background:transparent;overflow:hidden;
}
.swatch__chip::-webkit-color-swatch-wrapper{padding:0}
.swatch__chip::-webkit-color-swatch{border:0;border-radius:2px}
.swatch__chip::-moz-color-swatch{border:0;border-radius:2px}
.swatch__label{flex:1;min-width:0;font-size:var(--text-label);color:var(--color-text)}
/* Hex code readout — the .field base carries the underline + tabular-nums;
   this adds the swatch-specific width, muted resting colour, and uppercase.
   Filled input styling here would put a chrome box on every swatch row and
   drown the swatches themselves — the one thing on the row that should
   carry colour. */
.swatch__hex{
  width:62px;height:22px;
  font-size:var(--text-value);font-weight:400;
  color:var(--color-legend-muted);text-transform:uppercase;
}
.swatch__hex:hover:not(:disabled),
.swatch__hex:focus-visible{color:var(--color-legend)}

/* Select */
.select{
  display:block;width:100%;height:34px;padding:0 30px 0 10px;cursor:pointer;
  font-family:var(--font-ui);font-size:var(--text-label);font-weight:400;
  color:var(--color-legend);background:var(--color-surface-raised);
  border:0;border-radius:var(--radius-sm);
  -webkit-appearance:none;appearance:none;
  /* %23666666 must stay in sync with --color-legend-muted by hand:
     var() cannot be interpolated into a url() data-URI in plain CSS. */
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='9' height='6' fill='none'%3E%3Cpath d='M1 1L4.5 4.5L8 1' stroke='%23666666' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;
}

/* Toggle */
.toggle{display:flex;flex-direction:row;align-items:center;gap:var(--space-2)}
.toggle__label{flex:1;font-size:var(--text-label);color:var(--color-text)}
.toggle__switch{
  position:relative;width:30px;height:17px;flex-shrink:0;cursor:pointer;
  background:var(--color-surface-raised);border:0;border-radius:var(--radius-full);
  transition:background .15s ease;padding:0;
}
.toggle__switch:hover:not(:disabled){background:var(--color-seam)}
.toggle__switch.is-on{background:var(--color-accent)}
.toggle__switch.is-on:hover:not(:disabled){filter:brightness(.95)}
.toggle__label{cursor:pointer}
.toggle__knob{
  position:absolute;top:2px;left:2px;
  width:13px;height:13px;border-radius:var(--radius-full);
  background:var(--color-legend-muted);transition:transform .15s ease,background .15s ease;
}
.toggle__switch.is-on .toggle__knob{transform:translateX(13px);background:var(--color-on-accent)}

/* Preset grid */
.presets{display:flex;flex-direction:column;gap:6px}
.presets__row{display:flex;flex-direction:row;gap:6px}
.preset{
  display:flex;align-items:center;justify-content:center;gap:7px;
  flex:1;height:30px;min-width:0;cursor:pointer;
  background:var(--color-surface-raised);
  border:1px solid transparent;border-radius:var(--radius-sm);
  font-family:var(--font-ui);font-size:var(--text-label);font-weight:400;
  color:var(--color-legend-muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.preset:hover{color:var(--color-text)}
/* Active preset is a fill, not lime text — lime is unreadable as text
   on a light panel. Same treatment as the active effect segment. */
.preset.is-active{background:var(--color-accent);color:var(--color-on-accent);font-weight:700}
.preset--save{border:1px dashed var(--color-seam);background:transparent}
.preset--save:hover{border-color:var(--color-accent-ink);color:var(--color-accent-ink)}
.preset__dot{width:5px;height:5px;flex-shrink:0;border-radius:var(--radius-full);background:var(--color-accent-ink);display:none}
.preset.is-dirty .preset__dot{display:block}
.preset.is-active .preset__dot{background:var(--color-on-accent)}

/* User presets carry a trailing × that removes them. Nested <button> is
   illegal — this is a <span> with a click handler that stops propagation, and
   the row itself listens for the Delete key as a keyboard equivalent. Quiet
   grey at rest, danger red on hover, so removal reads as destructive. */
.preset__delete{
  display:none;width:14px;height:14px;margin-left:-2px;flex-shrink:0;
  padding:0;line-height:1;font-size:14px;font-weight:400;
  color:var(--color-legend-muted);
  background:transparent;border:0;border-radius:var(--radius-full);
  cursor:pointer;
}
.preset.is-user .preset__delete{display:inline-flex;align-items:center;justify-content:center}
.preset__delete:hover{color:var(--color-danger)}
.preset.is-active .preset__delete{color:var(--color-on-accent)}
.preset.is-active .preset__delete:hover{background:var(--color-on-accent);color:var(--color-danger)}

.presets__status{display:flex;flex-direction:row;align-items:center;gap:var(--space-2);padding-top:2px}
.presets__note{flex:1;font-size:var(--text-micro);color:var(--color-legend-muted)}
.presets__revert{
  font-family:var(--font-ui);font-size:var(--text-micro);font-weight:700;
  color:var(--color-accent-ink);background:none;border:0;cursor:pointer;padding:0;
}
.presets__revert[hidden]{display:none}

/* Source row */
.source{display:flex;flex-direction:row;align-items:center;gap:10px;padding:var(--space-2);background:var(--color-surface-raised);border-radius:var(--radius-sm)}
.source__thumb{width:32px;height:32px;flex-shrink:0;border-radius:2px;background:var(--color-seam);object-fit:cover;display:block}
.source__meta{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.source__name{font-size:var(--text-label);color:var(--color-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.source__dims{font-family:var(--font-numeric);font-size:var(--text-micro);color:var(--color-legend-muted);letter-spacing:.02em}
.source__action{
  flex-shrink:0;font-family:var(--font-ui);font-size:var(--text-value);font-weight:700;
  color:var(--color-accent-ink);background:none;border:0;cursor:pointer;padding:0;
}

/* Buttons */
.btn{
  display:flex;align-items:center;justify-content:center;
  height:36px;padding:0 18px;cursor:pointer;
  font-family:var(--font-ui);font-size:var(--text-label);font-weight:700;
  border:0;border-radius:var(--radius-md);
}
.btn--primary{background:var(--color-accent);color:var(--color-on-accent)}
.btn--primary:hover{filter:brightness(1.08)}
.btn--secondary{background:var(--color-surface-raised);color:var(--color-legend);border:1px solid var(--color-seam)}
.btn--secondary:hover{border-color:var(--color-accent-ink)}
.btn:disabled{background:var(--color-surface);border:1px solid var(--color-seam);color:var(--color-disabled);cursor:not-allowed;font-weight:400}
.btn:disabled:hover{filter:none;border-color:var(--color-seam)}

/* Import row */
.import{display:flex;flex-direction:row;gap:6px}
.input{
  flex:1;min-width:0;height:32px;padding:0 10px;
  font-family:var(--font-ui);font-size:var(--text-value);
  color:var(--color-legend);background:var(--color-surface-raised);
  border:1px solid transparent;border-radius:var(--radius-sm);
}
.input::placeholder{color:var(--color-legend-muted)}
.input:focus-visible{border-color:var(--color-accent-ink);outline:none}
.import__btn{
  flex-shrink:0;height:32px;padding:0 12px;cursor:pointer;
  font-family:var(--font-ui);font-size:var(--text-value);font-weight:700;
  color:var(--color-legend);background:var(--color-surface-raised);
  border:1px solid var(--color-seam);border-radius:var(--radius-sm);
}
.import__btn:hover{border-color:var(--color-accent-ink);color:var(--color-accent-ink)}
.import__report{font-size:var(--text-micro);color:var(--color-legend-muted);line-height:1.5}
.import__report[hidden]{display:none}

/* Export footer */
.export{display:flex;flex-direction:column;gap:10px;flex-shrink:0;padding:18px var(--space-5) var(--space-5)}
.export--top{border-top:1px solid var(--color-seam)}
.export__row{display:flex;flex-direction:row;gap:var(--space-2)}
.export__row .btn{flex:1;padding:0}
.export__meta{font-family:var(--font-numeric);font-size:var(--text-micro);color:var(--color-legend-muted);letter-spacing:.02em}

.progress{display:flex;flex-direction:row;align-items:center;width:100%;height:4px}
.progress__fill{height:4px;border-radius:var(--radius-full);background:var(--color-accent);width:0%}
.progress__rest{flex:1;height:4px;border-radius:var(--radius-full);background:var(--color-accent-dim)}

/* Status line — one transient message surface, between the scrolling body and
   the Export footer so export feedback lands next to the export controls.
   info/success clear themselves; error stays until the next action. The dot is
   a non-colour signal; role="status" carries it to assistive tech. */
.status{
  flex-shrink:0;
  display:flex;align-items:flex-start;gap:var(--space-2);
  padding:9px var(--space-5);
  border-top:1px solid var(--color-seam);
  font-size:var(--text-micro);line-height:1.45;
}
.status[hidden]{display:none}
.status::before{
  content:"";flex-shrink:0;
  width:6px;height:6px;margin-top:.3em;border-radius:var(--radius-full);
  background:currentColor;
}
.status--info{color:var(--color-legend-muted)}
.status--success{color:var(--color-accent-ink)}
.status--error{color:var(--color-danger)}

.hidden{display:none !important}
/* Browser default for [hidden] is display:none, but any author rule with the
   same-or-higher specificity (e.g. `.ctrl{display:flex}`) beats it. Force it
   with !important so a `hidden`-toggled `.ctrl` or `.swatch` actually vanishes
   — this is what syncControlStates relies on for inactive controls. */
[hidden]{display:none !important}

/* ============================================================
   RESPONSIVE — panel drops below the preview
   ============================================================ */
@media (max-width:900px){
  body{overflow:auto}
  .app{flex-direction:column;height:auto;min-height:100vh}
  .preview{padding:var(--space-5);height:auto;flex:0 0 auto}
  /* No viewport height to fill down here, so the fit box has no height to
     measure. fitPreview() detects this breakpoint and budgets height from
     the viewport instead — it must not read the box back, since the box now
     takes its height from the frame it just sized. */
  .stage{height:auto}
  .frame{flex:0 0 auto;min-height:0;height:auto}
  .panel{
    width:100%;flex:1 1 auto;height:auto;
    border-left:0;border-top:1px solid var(--color-seam);
  }
  .panel__body{overflow-y:visible}
}

/* ============================================================
   REDUCED MOTION
   The canvas is animation, so it cannot simply be disabled —
   it starts paused instead. See boot().
   ============================================================ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
  .rec__dot{animation:none}
}
</style>
</head>
<body>

<div class="app">
  <main class="preview" aria-label="Preview">
    <div class="stage">
      <div class="frame" id="frame">
      <div class="artboard" id="artboard" role="img" aria-label="Gradient — live preview">
        <canvas id="glview"></canvas>
        <canvas id="c2dview"></canvas>
        <div class="rec" id="rec"><span class="rec__dot"></span><span class="rec__label">REC</span></div>
        <div class="dropzone" id="dropzone">
          <svg width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true">
            <rect x="1" y="1" width="32" height="32" rx="3" stroke="var(--color-accent-ink)" stroke-width="1.5"/>
            <circle cx="11.5" cy="11.5" r="3" fill="var(--color-accent-ink)"/>
            <path d="M2 25L12 16L20 23L25 19L32 25" stroke="var(--color-accent-ink)" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
          <div style="display:flex;flex-direction:column;gap:7px">
            <span class="dropzone__title" id="dropzoneTitle">Drop an image to dither</span>
            <span class="dropzone__hint">JPG, PNG or WebP &nbsp;·&nbsp; square works best</span>
          </div>
          <button class="btn btn--primary" id="dropzoneBtn" type="button">Choose a file</button>
        </div>
      </div>
      </div>

      <div class="meta">
        <div class="meta__group">
          <span id="metaDims">2048 × 2048</span>
          <span class="meta__rule"></span>
          <span id="metaRatio">1:1</span>
        </div>
        <div class="transport" id="transport">
          <button class="transport__btn" id="playBtn" type="button" aria-label="Play or pause">
            <svg id="playIcon" width="9" height="10" viewBox="0 0 9 10" fill="none" aria-hidden="true">
              <rect x="0" y="0" width="3" height="10" rx="0.5" fill="var(--color-text)"/>
              <rect x="6" y="0" width="3" height="10" rx="0.5" fill="var(--color-text)"/>
            </svg>
          </button>
          <span class="transport__time" id="loopTime">0:00</span>
        </div>
        <span class="meta__file hidden" id="metaFile"></span>
      </div>
    </div>
  </main>

  <aside class="panel">
    <header class="panel__header">
      <h1 class="wordmark" translate="no">DE-GRADIENT</h1>
      <span class="panel__mark" role="img" aria-label="DG monogram"><span class="panel__mark-shimmer" aria-hidden="true"></span></span>
    </header>

    <nav class="switch" id="switch" aria-label="Effect"></nav>

    <div class="panel__body" id="controls"></div>

    <div class="status" id="statusLine" role="status" aria-live="polite" hidden></div>

    <footer class="export export--top" id="exportBlock"></footer>
  </aside>
</div>

<input type="file" id="fileInput" accept="image/*" class="hidden">

<script>
"use strict";

/* ============================================================================
   DE-GRADIENT
   One canvas, six mutually exclusive effects, aspect-ratio-aware export.
   Effects are declared as data (params + sections); the panel builds itself
   from that declaration, so adding a seventh effect needs no UI code.
   ============================================================================ */

var TAU = Math.PI * 2;
var EXPORT_FPS = 30;
/* localStorage keys retain the historical "gritaflux" prefix so user-saved
   presets survive the 2026-09-02 rename. Not user-visible; no reason to
   migrate and lose data. */
var STORE_KEY = "gritaflux.presets.v1";
var RATIO_KEY = "gritaflux.ratio.v1";

/* Aspect ratio is global, not per-effect: it is a property of the file you
   are making, not of the look. Every renderer takes width and height
   separately because of this — nothing may assume a square. It is also
   deliberately kept out of presets, so recalling a look never changes the
   shape of the file you are about to make.

   Two delivery sizes per ratio:
     ew / eh — still (PNG). Print-ish: 4K for the video shapes, 2048 short-
                edge for square/portrait.
     lw / lh — loop (MP4/webm). 1080p equivalents — matches every social
                video spec and is safe to capture in realtime through
                MediaRecorder. Decoupled from the still on purpose: 4K
                realtime capture drops frames and stresses the encoder,
                and no delivery target for a *video* loop needs it.
   These are delivery sizes, not a formula. Do not "simplify" them into a
   long-edge rule. */
var RATIOS = [
  { id: "1:1",  label: "1:1",  purpose: "square",     w: 1,  h: 1,  ew: 2048, eh: 2048, lw: 1080, lh: 1080 },
  { id: "16:9", label: "16:9", purpose: "video",      w: 16, h: 9,  ew: 3840, eh: 2160, lw: 1920, lh: 1080 },
  { id: "4:5",  label: "4:5",  purpose: "portrait",   w: 4,  h: 5,  ew: 2048, eh: 2560, lw: 1080, lh: 1350 },
  { id: "9:16", label: "9:16", purpose: "vertical video", w: 9, h: 16, ew: 2160, eh: 3840, lw: 1080, lh: 1920 }
];

/* ---------------------------------------------------------------- helpers */

function el(id){ return document.getElementById(id); }

function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }

/* H.264 will not accept an odd frame dimension, and loop capture reads the
   preview buffer directly — so every buffer this app sizes is even. */
function even(n){ return Math.max(2, Math.round(n / 2) * 2); }

function ratioById(id){
  for (var i = 0; i < RATIOS.length; i++) {
    if (RATIOS[i].id === id) return RATIOS[i];
  }
  return RATIOS[0];
}

function currentRatio(){ return ratioById(state.ratio); }

/* Filenames carry the ratio, so exporting the same look at two shapes does
   not produce two files you have to open to tell apart. */
function ratioSlug(){ return currentRatio().id.replace(":", "x"); }

function exportDims(){
  var r = currentRatio();
  return { w: r.ew, h: r.eh };
}

function loopDims(){
  var r = currentRatio();
  return { w: r.lw, h: r.lh };
}

function hexToRgb(hex){
  var h = hex.replace("#","");
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return [
    parseInt(h.substring(0,2),16)/255,
    parseInt(h.substring(2,4),16)/255,
    parseInt(h.substring(4,6),16)/255
  ];
}

/* Takes what a person actually types or pastes into a hex field — with or
   without the "#", 3-digit shorthand, any case, stray spaces — and returns the
   canonical "#rrggbb" params are stored as, or null if it is not a colour.
   Lowercase is not cosmetic: dirty-tracking compares params to the presets in
   EFFECTS as plain strings, so "#FF5005" would read as edited forever. */
function normalizeHex(str){
  var h = String(str).trim().replace(/^#/, "").toLowerCase();
  if (/^[0-9a-f]{3}$/.test(h)) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return /^[0-9a-f]{6}$/.test(h) ? "#" + h : null;
}

function hexToRgb255(hex){
  var c = hexToRgb(hex);
  return [Math.round(c[0]*255), Math.round(c[1]*255), Math.round(c[2]*255)];
}

/* HSL → "#rrggbb". Used by randomHexColor for the Random button — kept here
   with the other colour helpers rather than in preset-actions where it was
   originally added, since it's a colour-model conversion, not preset logic. */
function hslToHex(h, s, l){
  s /= 100; l /= 100;
  function k(n){ return (n + h / 30) % 12; }
  var a = s * Math.min(l, 1 - l);
  function f(n){ return l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); }
  function toHex(x){ var v = Math.round(x * 255).toString(16); return v.length === 1 ? "0" + v : v; }
  return "#" + toHex(f(0)) + toHex(f(8)) + toHex(f(4));
}

/* Random colour that lands somewhere usable — HSL with clamped saturation
   (45-85%) and lightness (35-75%). Pure random RGB is muddy or garish; this
   stays roughly in the range De-Gradient's built-in presets already live. */
function randomHexColor(){
  var h = Math.random() * 360;
  var s = 45 + Math.random() * 40;

var workCtx = work.getContext("2d", { willReadFrequently: true });

/* Luminance grid at a given cell size, with tone controls applied. The cell
   count is derived per axis from one shared cell size, so cells stay square
   at every ratio — a stretched dither cell would read as a mistake. */
function luminanceGrid(imageData, w, h, cell, p){
  var cols = Math.max(1, Math.floor(w / cell));
  var rows = Math.max(1, Math.floor(h / cell));
  var out = new Float32Array(cols * rows);
  var data = imageData.data;
  var cw = w / cols;
  var ch = h / rows;

  for (var y = 0; y < rows; y++) {
    for (var x = 0; x < cols; x++) {
      var x0 = Math.floor(x * cw), x1 = Math.floor((x + 1) * cw);
      var y0 = Math.floor(y * ch), y1 = Math.floor((y + 1) * ch);

      lum = clamp(lum, 0, 1);
      lum = Math.pow(lum, 1 / p.gamma);
      out[y * cols + x] = clamp(lum, 0, 1);

function drawDither(canvas, w, h, p, image){

    /* Floyd-Steinberg error diffusion over the cell grid. */

        if (x > 0 && y + 1 < rows)       buf[idx + cols - 1]    += err * 3 / 16;

        if (x + 1 < cols && y + 1 < rows) buf[idx + cols + 1]   += err * 1 / 16;

    ctx.putImageData(out, 0, 0);

    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = p.ink;
    for (var hy = 0; hy < rows; hy++) {

        var vv = grid[bi];

        var scaled = vv * (levels - 1);
        var base = Math.floor(scaled);
        var frac = scaled - base;
        var lvl = base + (frac > thr ? 1 : 0);

  }

  var g = cellGrid(w, h, Math.round(p.pixelSize * (Math.min(w, h) / 680)), 320);
  var cols = g.cols, rows = g.rows, cw = g.cw, ch = g.ch;
  var src = sampleGradientGrid(cols, rows, p, phase);
  var d = src.data;

  var levels = Math.max(2, Math.round(p.levels));
  var duo = (p.colorMode !== "gradient");
  var ink = hexToRgb255(p.ink);
  var paper = hexToRgb255(p.paper);

  if (p.pattern === "halftone") {
    ctx.fillStyle = p.paper;
    ctx.fillRect(0, 0, w, h);
    for (var hy = 0; hy < rows; hy++) {
      for (var hx = 0; hx < cols; hx++) {
        var hi = (hy * cols + hx) * 4;
        var hl = (0.2126 * d[hi] + 0.7152 * d[hi+1] + 0.0722 * d[hi+2]) / 255;
        var hq = clamp(quantChannel(hl, levels, 0.5, p.amount), 0, 1);
        var r = (1 - hq) * (Math.min(cw, ch) * 0.62);
        if (r > 0.15) {
          ctx.fillStyle = duo ? p.ink : ("rgb(" + d[hi] + "," + d[hi+1] + "," + d[hi+2] + ")");
          ctx.beginPath();
          ctx.arc((hx + 0.5) * cw, (hy + 0.5) * ch, r, 0, TAU);
          ctx.fill();
        }
      }
    }
    return;
  }

  var m = BAYER[p.pattern] || BAYER["8"];
  var n = m.length;
  var denom = n * n;

  blockCanvas.width = cols;
  blockCanvas.height = rows;
  var out = blockCtx.createImageData(cols, rows);
  var od = out.data;

  for (var y = 0; y < rows; y++) {
    for (var x = 0; x < cols; x++) {
      var i = (y * cols + x) * 4;
      var thr = (m[y % n][x % n] + 0.5) / denom;
      if (duo) {
        var l = (0.2126 * d[i] + 0.7152 * d[i+1] + 0.0722 * d[i+2]) / 255;
        var qv = clamp(quantChannel(l, levels, thr, p.amount), 0, 1);
        od[i]   = paper[0] + (ink[0] - paper[0]) * (1 - qv);
        od[i+1] = paper[1] + (ink[1] - paper[1]) * (1 - qv);
        od[i+2] = paper[2] + (ink[2] - paper[2]) * (1 - qv);
      } else {
        od[i]   = clamp(quantChannel(d[i]   / 255, levels, thr, p.amount), 0, 1) * 255;
        od[i+1] = clamp(quantChannel(d[i+1] / 255, levels, thr, p.amount), 0, 1) * 255;
        od[i+2] = clamp(quantChannel(d[i+2] / 255, levels, thr, p.amount), 0, 1) * 255;
      }
      od[i+3] = 255;
    }
  }

  blockCtx.putImageData(out, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(blockCanvas, 0, 0, cols, rows, 0, 0, w, h);
}

function drawGradientChars(canvas, w, h, p, phase){
  var ctx = canvas.getContext("2d");
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }

  var g = cellGrid(w, h, Math.round(p.cellSize * (Math.min(w, h) / 680)), 220);
  var cols = g.cols, rows = g.rows, cw = g.cw, ch = g.ch;
  var src = sampleGradientGrid(cols, rows, p, phase);
  var d = src.data;

  var duo = (p.colorMode !== "gradient");
  var ramp = CHARSETS[p.charset] || CHARSETS.classic;
  var last = ramp.length - 1;

  ctx.fillStyle = p.paper;
  ctx.fillRect(0, 0, w, h);
  ctx.font = Math.round(Math.min(cw, ch) * 1.08) + "px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  if (duo) ctx.fillStyle = p.ink;

  for (var y = 0; y < rows; y++) {
    for (var x = 0; x < cols; x++) {
      var i = (y * cols + x) * 4;
      var lum = (0.2126 * d[i] + 0.7152 * d[i+1] + 0.0722 * d[i+2]) / 255;
      var ci = Math.round((1 - lum) * last);
      var glyph = ramp.charAt(clamp(ci, 0, last));
      if (glyph === " ") continue;
      if (!duo) ctx.fillStyle = "rgb(" + d[i] + "," + d[i+1] + "," + d[i+2] + ")";
      ctx.fillText(glyph, (x + 0.5) * cw, (y + 0.5) * ch);
    }
  }
}

/* ------------------------------------------------------------ pixel dissolve
   Two flat colours meeting at a band that breaks into square pixels. Unlike
   Dots and Chars this does not sample the gradient at all — there is no
   continuous field to dither, only a probability ramp across the band, so the
   scatter is a per-cell hash rather than a threshold on luminance.

   Deterministic, not Math.random(): the field has to be identical from one
   frame to the next or the whole image would fizz. Everything that does move —
   the band drifting, the edge waving, cells boiling — completes a whole number
   of cycles per loop, so the loop stays exact the same way the gradient's does,
   with no cross-fade. */

function hashCell(x, y, seed){
  var n = Math.imul(x + 1, 374761393) ^ Math.imul(y + 1, 668265263) ^ Math.imul(seed + 1, 1442695041);
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  n = n ^ (n >>> 16);
  return (n >>> 0) / 4294967296;
}

function drawDissolve(canvas, w, h, p, phase){
  var ctx = canvas.getContext("2d");
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }

  var g = cellGrid(w, h, Math.round(p.pixelSize * (Math.min(w, h) / 680)), 480);
  var cols = g.cols, rows = g.rows;

  var a1 = hexToRgb255(p.colorA);
  var b1 = hexToRgb255(p.colorB);
  var a2 = hexToRgb255(p.colorA2 || p.colorA);
  var b2 = hexToRgb255(p.colorB2 || p.colorB);

  /* Two colours per side are scattered into each other rather than ramped, so
     each field stays flat and keeps the same pixel language as the band. At
     one colour per side, or a mix of 0, the second swatch is simply unused. */
  var mix = Number(p.colors) === 2 ? clamp(p.mix, 0, 1) : 0;

  var horiz = (p.direction === "right" || p.direction === "left");
  var flip  = (p.direction === "up" || p.direction === "left");

  var spread  = Math.max(0.002, p.spread);
  var falloff = Math.max(0.1, p.falloff);
  var boil    = clamp(p.boil, 0, 1);
  var seed    = Math.round(p.seed);
  var centre  = p.position + p.drift * 0.5 * Math.sin(TAU * phase);

  blockCanvas.width = cols;
  blockCanvas.height = rows;
  var out = blockCtx.createImageData(cols, rows);
  var od = out.data;

  /* The edge only varies along the cross axis, so it is one value per line,
     not one per cell. Two waves at 1× and 2× the loop rate keep it periodic
     while the 2.17 spatial ratio stops the two reading as one wave — space
     does not have to wrap, only time does. */
  var crossN = horiz ? rows : cols;
  var edges = new Float32Array(crossN);
  for (var c = 0; c < crossN; c++) {
    var v = (c + 0.5) / crossN;
    edges[c] = centre + p.wave * 0.5 * (
      Math.sin(TAU * (v * p.waveScale + phase)) * 0.6 +
      Math.sin(TAU * (v * p.waveScale * 2.17 + phase * 2)) * 0.4
    );
  }

  for (var y = 0; y < rows; y++) {
    for (var x = 0; x < cols; x++) {
      var i = (y * cols + x) * 4;

      var u = horiz ? (x + 0.5) / cols : (y + 0.5) / rows;
      if (flip) u = 1 - u;

      /* Position across the dissolve band: 0 at the solid-A edge, 1 at solid
         B. The gamma is what gives the reference look — a fast break-up
         followed by a long tail of sparse stragglers. */
      var t = (u - (edges[horiz ? y : x] - spread * 0.5)) / spread;
      var probA = t <= 0 ? 1 : (t >= 1 ? 0 : Math.pow(1 - t, falloff));

      var isA;
      if (probA >= 1) isA = true;
      else if (probA <= 0) isA = false;
      else {
        var r = hashCell(x, y, seed);
        /* Each cell boils on its own phase offset, so they shimmer out of
           step with one another instead of pulsing as a block. */
        var rv = boil > 0
          ? r * (1 - boil) + (0.5 + 0.5 * Math.sin(TAU * (phase + r))) * boil
          : r;
        isA = rv < probA;
      }

      var col;
      if (mix > 0) {
        /* A different salt, so the tint does not correlate with the dissolve
           scatter — sharing it would tint every surviving straggler the same
           way and read as a pattern rather than as a mix. Static, not boiled:
           a tint that boiled too would just look like noise. */
        var tint = hashCell(x, y, seed + 9973) < mix;
        col = isA ? (tint ? a2 : a1) : (tint ? b2 : b1);
      } else {
        col = isA ? a1 : b1;
      }

      od[i]   = col[0];
      od[i+1] = col[1];
      od[i+2] = col[2];
      od[i+3] = 255;
    }
  }

  blockCtx.putImageData(out, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(blockCanvas, 0, 0, cols, rows, 0, 0, w, h);
}
